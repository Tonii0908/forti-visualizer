[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fortidoc"
dynamic = ["version"]
description = "Dokumentation und aufgelöstes Regelwerk aus FortiGate-Konfigurations-Backups"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fortidoc = "fortidoc.cli:app"

[tool.setuptools.dynamic]
version = { attr = "fortidoc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortidoc = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
