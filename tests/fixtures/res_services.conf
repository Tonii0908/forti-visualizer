#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "WEB-MULTI"
        set tcp-portrange 80 443 8080-8090
    next
    edit "SRC-PORTS"
        set tcp-portrange 22:1024-65535 2222:40000
        set udp-portrange 514:514
    next
    edit "SCTP-SVC"
        set protocol TCP/UDP/SCTP
        set sctp-portrange 2905
    next
    edit "PING"
        set protocol ICMP
        set icmptype 8
    next
    edit "ICMP-FRAG"
        set protocol ICMP
        set icmptype 3
        set icmpcode 4
    next
    edit "ICMP-ANY"
        set protocol ICMP
    next
    edit "PING6"
        set protocol ICMP6
        set icmptype 128
    next
    edit "GRE"
        set protocol IP
        set protocol-number 47
    next
    edit "BROKEN"
        set tcp-portrange 70000 abc
    next
    edit "EMPTY"
        set protocol TCP/UDP/SCTP
    next
end
config firewall service group
    edit "grp-web"
        set member "WEB-MULTI" "PING"
    next
    edit "grp-nested"
        set member "grp-web" "GRE"
    next
    edit "grp-loop-1"
        set member "PING" "grp-loop-2"
    next
    edit "grp-loop-2"
        set member "grp-loop-1"
    next
end
config firewall policy
    edit 1
        set name "multi-range"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SRC-PORTS" "SCTP-SVC"
    next
    edit 2
        set name "groups"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "grp-nested" "grp-loop-1"
    next
    edit 3
        set name "icmp-ip"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ICMP-FRAG" "ICMP-ANY" "PING6" "ALL" "BROKEN" "EMPTY" "NO-SUCH-SERVICE"
    next
end
