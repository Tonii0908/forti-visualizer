#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set type physical
    next
    edit "wan2"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set type physical
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set type physical
    next
    edit "tun-hq"
        set vdom "root"
        set type tunnel
        set interface "wan1"
    next
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
        edit "SASE"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set gateway 192.0.2.254
        next
        edit 2
            set interface "wan2"
            set zone "SASE"
        next
    end
    config health-check
        edit "ping"
            set server "198.51.100.200"
            set members 1 2
        next
    end
end
config firewall address
    edit "all"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
end
config firewall policy
    edit 1
        set name "from-sdwan"
        set srcintf "virtual-wan-link"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "from-tunnel"
        set srcintf "tun-hq"
        set dstintf "internal"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 3
        set name "unknown-interface"
        set srcintf "ghost-if" "internal"
        set dstintf "SASE"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 4
        set name "any-any"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
    next
end
