#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system replacemsg http "url-block"
    set buffer "<html><body>
config firewall policy
    edit 99
        set action accept
        set note \"escaped quote inside\"
    next
end
next
end
unset everything
</body></html>"
