#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config firewall addrgrp
    edit "grp \"quoted\" name"
        set member "a" "b c" "d\\e"
        set comment "path C:\\temp and \"q\" here"
    next
end
config firewall address
    edit "plain"
        set comment ""
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "apostrophe"
        set comment "Bob's rule # not a comment"
        set fqdn host#1.example.com
        set associated-interface	"tab-separated"
    next
    edit "other-backslash"
        set comment "keep \n and \t literally"
    next
end
