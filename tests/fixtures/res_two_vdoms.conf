#config-version=FGVM64-7.4.3-FW-build2573-240201:opmode=0:vdom=1:user=admin
config vdom
edit root
next
edit dmz
next
end
config global
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.0.2.10 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "dmz"
        set ip 172.16.20.1 255.255.255.0
        set type physical
    next
    edit "port3"
        set ip 10.30.0.1 255.255.255.0
        set type physical
    next
end
end
config vdom
edit root
config firewall address
    edit "all"
    next
    edit "root-net"
        set subnet 10.1.0.0 255.255.0.0
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
end
config firewall policy
    edit 1
        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "root-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
next
end
config vdom
edit dmz
config firewall address
    edit "all"
    next
    edit "dmz-web"
        set subnet 172.16.20.10 255.255.255.255
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall policy
    edit 1
        set srcintf "port2"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "dmz-web"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
end
next
end
