#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "net-1"
        set subnet 10.0.1.0 255.255.255.0
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "SSH"
        set tcp-portrange 22
    next
    edit "DNS"
        set udp-portrange 53
    next
end
config firewall policy
    edit 1
        set name "only-fsso"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set fsso-groups "CN=synthetic-group"
    next
    edit 2
        set name "inside-fsso"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-1"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 3
        set name "only-ztna"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set ztna-status enable
        set ztna-ems-tag "synthetic-tag"
    next
    edit 4
        set name "inside-ztna"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-1"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "SSH"
    next
    edit 5
        set name "other-unknown-key"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set synthetic-unknown-key enable
    next
    edit 6
        set name "inside-unknown"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-1"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS"
    next
end
config firewall local-in-policy
    edit 1
        set intf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "SSH"
        set schedule "always"
        set ha-mgmt-intf-only enable
    next
    edit 2
        set intf "port1"
        set srcaddr "net-1"
        set dstaddr "all"
        set action accept
        set service "SSH"
        set schedule "always"
    next
end
