#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "FABRIC_DEVICE"
        set comment "IPv4 addresses of Fabric Devices."
    next
    edit "net-lan"
        set subnet 10.0.1.0 255.255.255.0
    next
    edit "net-unused"
        set subnet 10.9.9.0 255.255.255.0
    next
    edit "net-commented"
        set subnet 10.9.8.0 255.255.255.0
    next
    edit "mgmt-net"
        set subnet 10.0.99.0 255.255.255.0
    next
    edit "net-member"
        set subnet 10.0.50.0 255.255.255.0
    next
    edit "=cmd"
        set subnet 10.0.2.10 255.255.255.255
        set comment "=HYPERLINK(\"http://example.invalid\")"
    next
end
config firewall address6
    edit "all6"
        set ip6 ::/0
    next
end
config firewall addrgrp
    edit "grp-unused"
        set member "net-member"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "svc-unused"
        set tcp-portrange 8443
    next
end
config firewall ippool
    edit "pool-unused"
        set startip 203.0.113.50
        set endip 203.0.113.51
    next
end
config firewall vip
    edit "vip-unused"
        set extip 203.0.113.60
        set mappedip "10.0.2.60"
        set extintf "port1"
    next
end
config firewall policy
    edit 1
        set name "any-source"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "net-lan"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set comments "mentions net-commented only in a comment"
    next
    edit 2
        set name "all-services-no-log"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-lan"
        set dstaddr "=cmd"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set comments "=> siehe Ticket"
    next
    edit 3
        set name "fabric-source"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "FABRIC_DEVICE"
        set dstaddr "net-lan"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 4
        set name "disabled-deny"
        set status disable
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
    next
    edit 5
        set name "v6-any"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr6 "all6"
        set dstaddr6 "all6"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 6
        set name "negated-all"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set srcaddr-negate enable
        set dstaddr "net-lan"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
end
config firewall local-in-policy
    edit 1
        set intf "port1"
        set srcaddr "mgmt-net"
        set dstaddr "all"
        set action accept
        set service "HTTPS"
        set schedule "always"
        set comments "localin-only-marker"
    next
end
