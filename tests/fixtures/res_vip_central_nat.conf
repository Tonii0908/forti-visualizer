#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set type physical
    next
end
config system settings
    set central-nat enable
end
config firewall address
    edit "all"
    next
    edit "srv-web"
        set subnet 10.0.2.10 255.255.255.255
    next
    edit "net-dmz"
        set subnet 10.0.2.0 255.255.255.0
    next
    edit "net-lan"
        set subnet 10.0.1.0 255.255.255.0
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall vip
    edit "vip-web"
        set extip 203.0.113.10
        set mappedip "10.0.2.10"
        set extintf "wan1"
        set portforward enable
        set extport 8443
        set mappedport 443
    next
end
config firewall ippool
    edit "pool-out"
        set startip 203.0.113.20
        set endip 203.0.113.25
    next
    edit "pool-1to1"
        set type one-to-one
        set startip 203.0.113.30
        set endip 203.0.113.31
    next
end
config firewall central-snat-map
    edit 1
        set srcintf "port2"
        set dstintf "wan1"
        set orig-addr "net-dmz"
        set dst-addr "all"
        set nat-ippool "pool-out"
    next
    edit 2
        set status disable
        set srcintf "port1"
        set dstintf "wan1"
        set orig-addr "net-lan"
        set dst-addr "all"
    next
end
config firewall policy
    edit 1
        set name "inbound-web"
        set srcintf "wan1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "srv-web"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 2
        set name "lan-out"
        set srcintf "port1"
        set dstintf "wan1"
        set srcaddr "net-lan"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 3
        set name "inbound-any"
        set srcintf "wan1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
end
