#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
    next
    edit "net-guest"
        set subnet 10.0.1.128 255.255.255.128
    next
    edit "net-blocked"
        set subnet 192.0.2.0 255.255.255.0
    next
    edit "srv"
        set subnet 10.0.2.5 255.255.255.255
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall policy
    edit 1
        set name "negate-and-isdb"
        set srcintf "port1"
        set dstintf "wan1"
        set srcaddr "net-guest"
        set srcaddr-negate enable
        set internet-service enable
        set internet-service-name "Microsoft-Office365" "Amazon-AWS"
        set action accept
        set schedule "always"
    next
    edit 2
        set name "negate-dst-service"
        set srcintf "port1"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "net-blocked"
        set dstaddr-negate enable
        set service "HTTPS"
        set service-negate enable
        set action accept
        set schedule "always"
    next
    edit 3
        set name "isdb-source"
        set srcintf "wan1"
        set dstintf "port2"
        set internet-service-src enable
        set internet-service-src-name "Botnet-C&C.Server"
        set dstaddr "srv"
        set service "HTTPS"
        set action deny
        set schedule "always"
    next
end
