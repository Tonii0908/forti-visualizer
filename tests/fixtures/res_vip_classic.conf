#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall vip
    edit "vip-web"
        set extip 203.0.113.10
        set mappedip "10.0.2.10"
        set extintf "wan1"
        set portforward enable
        set extport 8443
        set mappedport 443
    next
    edit "vip-static"
        set extip 203.0.113.11
        set mappedip "10.0.2.11"
    next
    edit "vip-udp-range"
        set extip 203.0.113.12-203.0.113.13
        set mappedip "10.0.2.20-10.0.2.21"
        set extintf "wan1"
        set portforward enable
        set protocol udp
        set extport 5000-5010
        set mappedport 6000-6010
    next
end
config firewall vipgrp
    edit "vipgrp-dmz"
        set interface "wan1"
        set member "vip-web" "vip-static"
    next
end
config firewall ippool
    edit "pool-out"
        set startip 203.0.113.20
        set endip 203.0.113.25
    next
end
config firewall policy
    edit 1
        set name "publish-web"
        set srcintf "wan1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "vip-web"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 2
        set name "publish-group"
        set srcintf "wan1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "vipgrp-dmz" "vip-udp-range"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 3
        set name "outbound-pool"
        set srcintf "port2"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set nat enable
        set ippool enable
        set poolname "pool-out"
    next
end
