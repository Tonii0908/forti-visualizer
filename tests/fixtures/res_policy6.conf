#config-version=FGT60E-6.2.9-FW-build1339-210413:opmode=0:vdom=0:user=admin
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set type physical
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set type hard-switch
    next
end
config firewall address
    edit "all"
    next
end
config firewall address6
    edit "all"
    next
    edit "v6-lan"
        set ip6 2001:db8:10::/64
    next
    edit "v6-range"
        set type iprange
        set start-ip 2001:db8:20::1
        set end-ip 2001:db8:20::ff
    next
    edit "v6-fqdn"
        set type fqdn
        set fqdn "v6.example.com"
    next
end
config firewall addrgrp6
    edit "grp6"
        set member "v6-lan" "v6-range"
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall policy
    edit 1
        set name "v4-out"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set nat enable
    next
end
config firewall policy6
    edit 1
        set name "v6-out"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "grp6"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 2
        set name "v6-default-deny"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "v6-fqdn"
        set dstaddr "all"
        set schedule "always"
        set service "HTTPS"
    next
end
