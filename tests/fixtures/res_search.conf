#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.10.20.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.0
        set type physical
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.50.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "FABRIC_DEVICE"
        set comment "IPv4 addresses of Fabric Devices."
    next
    edit "net-lan"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "host-15"
        set subnet 10.10.20.15 255.255.255.255
    next
    edit "range-a"
        set type iprange
        set start-ip 10.10.20.10
        set end-ip 10.10.20.20
    next
    edit "fqdn-x"
        set type fqdn
        set fqdn "x.example.com"
    next
    edit "geo-de"
        set type geography
        set country "DE"
    next
    edit "dyn-sdn"
        set type dynamic
        set sub-type sdn
        set sdn "azure"
    next
    edit "srv-dmz"
        set subnet 192.168.50.10 255.255.255.255
    next
end
config firewall address6
    edit "net6-doc"
        set ip6 2001:db8::/32
    next
end
config firewall vip
    edit "vip-web"
        set extip 203.0.113.10
        set extintf "port2"
        set mappedip "192.168.50.10"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "WEB-RANGE"
        set tcp-portrange 400-500
    next
    edit "DNS-UDP"
        set udp-portrange 53
    next
    edit "TCP-ANY"
        set protocol IP
        set protocol-number 6
    next
    edit "SRC-RESTRICTED"
        set tcp-portrange 443:1024-2048
    next
    edit "PING"
        set protocol ICMP
        set icmptype 8
    next
end
config firewall policy
    edit 1
        set name "lan-to-dmz-https"
        set srcintf "port1"
        set dstintf "port3"
        set srcaddr "net-lan"
        set dstaddr "srv-dmz"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 2
        set name "fqdn-source"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "fqdn-x"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 3
        set name "negated-source"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-lan"
        set srcaddr-negate enable
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 4
        set name "geo-source"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "geo-de"
        set dstaddr "net-lan"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 5
        set name "dynamic-source"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "dyn-sdn"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 6
        set name "isdb-source"
        set srcintf "port2"
        set dstintf "port1"
        set internet-service-src enable
        set internet-service-src-name "Example-Cloud"
        set dstaddr "net-lan"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 7
        set name "dmz-source"
        set srcintf "port3"
        set dstintf "port2"
        set srcaddr "srv-dmz"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "DNS-UDP"
    next
    edit 8
        set name "range-all-services"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "range-a"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 9
        set name "ipv6"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr6 "net6-doc"
        set dstaddr6 "net6-doc"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 10
        set name "service-negated"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "host-15"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "HTTPS"
        set service-negate enable
    next
    edit 11
        set name "source-port-restricted"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "host-15"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SRC-RESTRICTED"
    next
    edit 12
        set name "fabric-source"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "FABRIC_DEVICE"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 13
        set name "vip-inbound"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "vip-web"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 14
        set name "tcp-any-ping"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-lan"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "TCP-ANY" "PING"
    next
    edit 15
        set name "web-range-udp"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "host-15"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "WEB-RANGE" "DNS-UDP"
    next
end
