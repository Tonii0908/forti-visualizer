#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "none"
        set subnet 0.0.0.0 255.255.255.255
    next
    edit "FABRIC_DEVICE"
        set comment "IPv4 addresses of Fabric Devices."
    next
    edit "gmail.com"
        set type fqdn
        set fqdn "gmail.com"
    next
    edit "wildcard.google.com"
        set type fqdn
        set fqdn "*.google.com"
    next
    edit "net-lan"
        set subnet 10.0.1.0 255.255.255.0
    next
    edit "net-own-unused"
        set subnet 10.9.9.0 255.255.255.0
    next
end
config firewall address6
    edit "all"
    next
    edit "SSLVPN_TUNNEL_IPv6_ADDR1"
        set ip6 fdff:ffff::/120
    next
end
config firewall addrgrp
    edit "G Suite"
        set member "gmail.com" "wildcard.google.com"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "AFS3"
        set tcp-portrange 7000-7009
        set udp-portrange 7000-7009
    next
    edit "GOPHER"
        set tcp-portrange 70
    next
    edit "QUAKE"
        set udp-portrange 26000 27000 27910 27960
    next
    edit "gopher"
        set tcp-portrange 7070
    next
    edit "svc-own-unused"
        set tcp-portrange 8443
    next
end
config firewall service group
    edit "Web Access"
        set member "HTTPS"
    next
end
config firewall policy
    edit 1
        set name "web"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-lan"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
end
