#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system settings
    set ngfw-mode policy-based
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "net-lan"
        set subnet 10.0.1.0 255.255.255.0
    next
end
config firewall address6
    edit "all"
        set ip6 ::/0
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall policy
    edit 1
        set name "ssl-inspection"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set ssl-ssh-profile "certificate-inspection"
    next
end
config firewall security-policy
    edit 1
        set name "web-apps"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-lan"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set application 15832 16354
        set app-category 2
        set logtraffic all
    next
    edit 2
        set name "old-style-v4"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr4 "net-lan"
        set dstaddr4 "all"
        set url-category 52
        set schedule "always"
        set service "HTTPS"
    next
    edit 3
        set name "lan-https"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-lan"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 4
        set name "lan-https-app"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "net-lan"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "HTTPS"
        set application 15832
    next
end
