#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2S3CR3TadminHashValue0000000000==
    next
end
config system ha
    set group-name "ha-lab"
    set password ENC S3CR3ThaPassword==
end
config user local
    edit "bob"
        set type password
        set passwd ENC S3CR3TbobPassword==
    next
end
config user ldap
    edit "ldap1"
        set server "10.0.0.5"
        set username "cn=bind"
        set password "S3CR3TplainLdapPassword"
    next
end
config user radius
    edit "rad1"
        set server "10.0.0.6"
        set secret ENC S3CR3TradiusSecret==
    next
end
config vpn ipsec phase1-interface
    edit "tun-hq"
        set interface "wan1"
        set peertype any
        set remote-gw 203.0.113.5
        set psksecret ENC S3CR3TpskValue0123456789==
        set keylife 28800
    next
end
config router key-chain
    edit "kc1"
        config key
            edit "1"
                set key-string ENC S3CR3TkeyString==
            next
        end
    next
end
config router ospf
    config ospf-interface
        edit "o1"
            set authentication md5
            set md5-keys "S3CR3Tmd5Plain"
        next
    end
end
config vpn certificate local
    edit "srv-cert"
        set password ENC S3CR3TcertPassword==
        set comments "certificate with password protection"
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
S3CR3TprivateKeyLine1
S3CR3TprivateKeyLine2
-----END ENCRYPTED PRIVATE KEY-----"
        set certificate "-----BEGIN CERTIFICATE-----
S3CR3TcertificateLine1
-----END CERTIFICATE-----"
    next
end
config firewall policy
    edit 1
        set name "password-reset-portal"
        set comments "rule mentions password and psk in plain text"
        set action accept
    next
end
