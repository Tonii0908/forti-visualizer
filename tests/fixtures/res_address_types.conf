#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
    next
    edit "a-ipmask"
        set subnet 10.0.1.0 255.255.255.0
    next
    edit "a-hostbits"
        set subnet 10.0.1.5 255.255.255.0
    next
    edit "a-iprange"
        set type iprange
        set start-ip 10.0.9.1
        set end-ip 10.0.9.50
    next
    edit "a-fqdn"
        set type fqdn
        set fqdn "www.example.com"
    next
    edit "a-wildcard-contiguous"
        set type wildcard
        set wildcard 10.8.0.0 255.255.0.0
    next
    edit "a-wildcard"
        set type wildcard
        set wildcard 10.0.0.5 255.0.255.255
    next
    edit "a-geo"
        set type geography
        set country "DE"
    next
    edit "a-dynamic"
        set type dynamic
        set sub-type sdn
        set sdn "cloud-connector"
        set filter "Tag.env=prod"
    next
    edit "a-ifsubnet"
        set type interface-subnet
        set interface "port2"
    next
    edit "a-ifsubnet-unknown"
        set type interface-subnet
        set interface "no-such-port"
    next
    edit "a-mac"
        set type mac
        set macaddr "00:11:22:33:44:55"
    next
    edit "a-future-type"
        set type something-new
    next
end
config firewall address6
    edit "all"
    next
    edit "a6-prefix"
        set ip6 2001:db8:1::/48
    next
    edit "a6-range"
        set type iprange
        set start-ip 2001:db8:2::1
        set end-ip 2001:db8:2::ff
    next
    edit "a6-fqdn"
        set type fqdn
        set fqdn "v6.example.com"
    next
end
config firewall addrgrp6
    edit "g6"
        set member "a6-prefix" "a6-range"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
end
config firewall policy
    edit 1
        set name "types-a"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "a-ipmask" "a-hostbits" "a-iprange" "a-wildcard-contiguous" "a-wildcard"
        set dstaddr "a-fqdn" "a-geo" "a-dynamic" "a-ifsubnet" "a-ifsubnet-unknown" "a-mac" "a-future-type"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
