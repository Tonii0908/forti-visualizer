#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system global
    set hostname "fw-res-01"
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set type physical
        set role wan
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set type hard-switch
        config ipv6
            set ip6-address 2001:db8:10::1/64
        end
    next
    edit "vlan20"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set interface "internal"
        set vlanid 20
    next
    edit "lag1"
        set vdom "root"
        set type aggregate
        set member "port3" "port4"
    next
    edit "lo-mgmt"
        set vdom "root"
        set ip 10.255.255.1 255.255.255.255
        set type loopback
    next
    edit "port3"
        set vdom "root"
        set type physical
    next
    edit "port4"
        set vdom "root"
        set type physical
    next
end
config system zone
    edit "LAN"
        set interface "internal" "vlan20"
    next
end
config firewall address
    edit "all"
        set uuid aaaaaaaa-0000-0000-0000-000000000001
    next
    edit "net-lan"
        set subnet 10.10.10.0 255.255.255.0
        set comment "LAN segment"
    next
    edit "net-vlan20"
        set subnet 10.20.0.0 255.255.255.0
    next
    edit "h-dns"
        set subnet 198.51.100.53 255.255.255.255
    next
end
config firewall addrgrp
    edit "grp-clients"
        set member "net-lan" "net-vlan20"
    next
end
config firewall service custom
    edit "ALL"
        set category "General"
        set protocol IP
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "DNS"
        set tcp-portrange 53
        set udp-portrange 53
    next
end
config firewall policy
    edit 10
        set name "clients-web"
        set uuid bbbbbbbb-0000-0000-0000-000000000010
        set srcintf "LAN"
        set dstintf "wan1"
        set action accept
        set srcaddr "grp-clients"
        set dstaddr "all"
        set schedule "always"
        set service "HTTPS" "DNS"
        set nat enable
        set logtraffic all
        set utm-status enable
        set av-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set comments "outbound web"
    next
    edit 3
        set name "dns-only"
        set srcintf "LAN"
        set dstintf "wan1"
        set action accept
        set srcaddr "net-lan"
        set dstaddr "h-dns"
        set schedule "always"
        set service "DNS"
        set some-future-setting "kept"
    next
    edit 7
        set name "block-rest"
        set srcintf "lag1"
        set dstintf "wan1"
        set action deny
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set users "alice"
        set groups "staff"
    next
end
config log setting
    set fwpolicy-implicit-log enable
end
