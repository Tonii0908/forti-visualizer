#config-version=FGVM64-7.4.3-FW-build2573-240201:opmode=0:vdom=1:user=admin
#conf_file_ver=2222222222222222222
#buildno=2573
#global_vdom=1
config vdom
edit root
next
edit dmz
next
end
config global
config system global
    set hostname "fw-lab-02"
    set vdom-mode multi-vdom
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.0.2.10 255.255.255.0
    next
    edit "port2"
        set vdom "dmz"
        set ip 172.16.20.1 255.255.255.0
    next
end
end
config vdom
edit root
config system settings
    set opmode nat
end
config firewall address
    edit "root-net"
        set subnet 10.1.0.0 255.255.0.0
    next
end
config firewall policy
    edit 1
        set srcintf "port1"
        set dstintf "port1"
        set srcaddr "root-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
next
end
config vdom
edit dmz
config firewall address
    edit "dmz-web"
        set subnet 172.16.20.10 255.255.255.255
    next
end
config firewall policy
    edit 1
        set srcintf "port2"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "dmz-web"
        set schedule "always"
        set service "HTTPS"
    next
end
next
end
