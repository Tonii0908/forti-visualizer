#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "mgmt-net"
        set subnet 10.0.99.0 255.255.255.0
    next
    edit "fw-wan"
        set subnet 198.51.100.2 255.255.255.255
    next
end
config firewall address6
    edit "all"
        set ip6 ::/0
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "SSH"
        set tcp-portrange 22
    next
    edit "PING"
        set protocol ICMP
        set icmptype 8
    next
end
config firewall local-in-policy
    edit 1
        set intf "port2"
        set srcaddr "all"
        set dstaddr "fw-wan"
        set action accept
        set service "HTTPS"
        set schedule "always"
        set comments "Admin-GUI aus dem Internet"
    next
    edit 2
        set intf "port1"
        set srcaddr "mgmt-net"
        set dstaddr "all"
        set action accept
        set service "SSH"
        set schedule "always"
    next
    edit 3
        set intf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set service "PING"
        set schedule "always"
    next
    edit 4
        set srcintf "port1"
        set srcaddr "mgmt-net"
        set dstaddr "all"
        set action accept
        set service "SSH"
        set schedule "always"
    next
end
config firewall local-in-policy6
    edit 1
        set intf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set service "SSH"
        set schedule "always"
    next
end
config firewall policy
    edit 1
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "mgmt-net"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
end
