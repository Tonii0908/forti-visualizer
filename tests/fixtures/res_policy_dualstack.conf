#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.1 255.255.255.0
        set type physical
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
    next
    edit "net-lan"
        set subnet 10.10.10.0 255.255.255.0
    next
end
config firewall address6
    edit "all"
    next
    edit "v6-lan"
        set ip6 2001:db8:10::/64
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall policy
    edit 1
        set name "dual-stack"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "net-lan"
        set dstaddr "all"
        set srcaddr6 "v6-lan"
        set dstaddr6 "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 2
        set name "v6-only"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr6 "v6-lan"
        set dstaddr6 "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
end
