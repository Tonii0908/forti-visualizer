#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config router bgp
    set as 65001
    config neighbor
        edit "192.0.2.2"
            set remote-as 65002
        next
    end
end
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set gateway 192.0.2.254
        next
    end
    config health-check
        edit "ping-check"
            set server "198.51.100.1"
            config sla
                edit 1
                    set latency-threshold 100
                next
            end
        next
    end
end
config firewall policy
    edit 7
        set name "with-unset"
        unset schedule
        set action accept
    next
end
