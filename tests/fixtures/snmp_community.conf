    set contact-info "noc team"
end
config system snmp community
    edit 1
        set name "S3CR3Tcommunity"
        config hosts
            edit 1
                set ip 10.0.0.50 255.255.255.255
            next
        end
    next
end
config firewall address
    edit "name-is-harmless-here"
        set comment "snmp unrelated"
    next
end
