#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
end
config system zone
    edit "<script>alert(7)</script>"
        set interface "port1"
    next
    edit "zone-with-a-very-long-name-for-the-diagram"
        set interface "port2"
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config firewall policy
    edit 1
        set srcintf "<script>alert(7)</script>"
        set dstintf "zone-with-a-very-long-name-for-the-diagram"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
