#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "all"
    next
    edit "net-a"
        set subnet 10.1.0.0 255.255.255.0
    next
    edit "net-b"
        set subnet 10.2.0.0 255.255.255.0
    next
    edit "net-big"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "host-1"
        set subnet 10.1.0.10 255.255.255.255
    next
    edit "range-c"
        set type iprange
        set start-ip 10.3.0.1
        set end-ip 10.3.0.20
    next
    edit "fqdn-x"
        set type fqdn
        set fqdn "x.example.com"
    next
end
config firewall addrgrp
    edit "grp-inner"
        set member "net-a" "range-c"
    next
    edit "grp-middle"
        set member "grp-inner" "net-b"
    next
    edit "grp-outer"
        set member "grp-middle" "host-1"
    next
    edit "grp-loop-a"
        set member "net-a" "grp-loop-b"
    next
    edit "grp-loop-b"
        set member "net-b" "grp-loop-a"
    next
    edit "grp-exclude"
        set member "net-big"
        set exclude enable
        set exclude-member "net-a" "grp-inner"
    next
    edit "grp-exclude-fqdn"
        set member "net-a" "fqdn-x"
        set exclude enable
        set exclude-member "host-1"
    next
    edit "grp-exclude-disabled"
        set member "net-a"
        set exclude-member "host-1"
    next
    edit "grp-missing"
        set member "net-a" "does-not-exist"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
end
config firewall policy
    edit 1
        set name "nested"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "grp-outer"
        set dstaddr "grp-loop-a"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "exclusions"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "grp-exclude"
        set dstaddr "grp-exclude-fqdn" "grp-exclude-disabled"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 3
        set name "missing-object"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "grp-missing"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
