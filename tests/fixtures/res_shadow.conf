#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.0
        set type physical
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.50.1 255.255.255.0
        set type physical
    next
end
config system zone
    edit "lan"
        set interface "port1"
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
    edit "net-16"
        set subnet 10.0.0.0 255.255.0.0
    next
    edit "net-1"
        set subnet 10.0.1.0 255.255.255.0
    next
    edit "net-other"
        set subnet 10.1.0.0 255.255.255.0
    next
    edit "half-a"
        set subnet 10.5.0.0 255.255.255.128
    next
    edit "half-b"
        set subnet 10.5.0.128 255.255.255.128
    next
    edit "net-5"
        set subnet 10.5.0.0 255.255.255.0
    next
    edit "fqdn-x"
        set type fqdn
        set fqdn "x.example.com"
    next
    edit "web-1"
        set subnet 192.168.50.10 255.255.255.255
    next
end
config firewall addrgrp
    edit "grp-halves"
        set member "half-a" "half-b"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "ALL_TCP"
        set tcp-portrange 1-65535
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "HTTPS-SRC"
        set tcp-portrange 443:1024-65535
    next
    edit "SSH"
        set tcp-portrange 22
    next
end
config user group
    edit "admins"
    next
end
config firewall schedule recurring
    edit "office"
        set day monday
    next
end
config firewall policy
    edit 1
        set name "broad-lan"
        set srcintf "lan"
        set dstintf "port2"
        set srcaddr "net-16"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "shadowed-deny"
        set srcintf "lan"
        set dstintf "port2"
        set srcaddr "net-1"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "HTTPS"
    next
    edit 3
        set name "other-net"
        set srcintf "lan"
        set dstintf "port2"
        set srcaddr "net-other"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 4
        set name "negated"
        set srcintf "lan"
        set dstintf "port2"
        set srcaddr "net-1"
        set srcaddr-negate enable
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 5
        set name "fqdn-dst"
        set srcintf "lan"
        set dstintf "port2"
        set srcaddr "net-1"
        set dstaddr "fqdn-x"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 10
        set name "disabled-broad"
        set status disable
        set srcintf "any"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 11
        set name "web-only-office"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "web-1"
        set action accept
        set schedule "office"
        set service "HTTPS"
    next
    edit 12
        set name "admins-only"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "web-1"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set groups "admins"
    next
    edit 13
        set name "web-public"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "web-1"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
    edit 14
        set name "any-src-intf"
        set srcintf "any"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "web-1"
        set action accept
        set schedule "always"
        set service "ALL_TCP"
    next
    edit 15
        set name "redundant-src-port"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "web-1"
        set action accept
        set schedule "always"
        set service "HTTPS-SRC"
    next
    edit 16
        set name "ssh-via-port2"
        set srcintf "port2"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "web-1"
        set action accept
        set schedule "always"
        set service "SSH"
    next
    edit 20
        set name "halves"
        set srcintf "lan"
        set dstintf "port3"
        set srcaddr "grp-halves"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS-SRC"
    next
    edit 21
        set name "covered-by-union"
        set srcintf "lan"
        set dstintf "port3"
        set srcaddr "net-5"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS-SRC"
    next
    edit 22
        set name "src-port-not-covering"
        set srcintf "lan"
        set dstintf "port3"
        set srcaddr "net-5"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
    next
end
