#config-version=FGT60E-6.2.9-FW-build1339-210413:opmode=0:vdom=0:user=admin
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set type physical
    next
    edit "wan2"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set type physical
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set type hard-switch
    next
end
config system virtual-wan-link
    set status enable
    config members
        edit 1
            set interface "wan1"
            set gateway 192.0.2.254
        next
        edit 2
            set interface "wan2"
        next
    end
    config health-check
        edit "ping"
            set server "198.51.100.200"
        next
    end
end
config firewall address
    edit "all"
    next
    edit "FABRIC_DEVICE"
        set comment "IPv4 addresses of Fabric Devices."
    next
end
config firewall address6
    edit "all"
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
end
config firewall policy
    edit 1
        set name "lan-to-vwl"
        set srcintf "internal"
        set dstintf "virtual-wan-link"
        set srcaddr "FABRIC_DEVICE"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
end
