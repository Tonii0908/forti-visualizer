#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=1111111111111111111
#buildno=1517
#global_vdom=1
config system global
    set alias "FGT60F"
    set hostname "fw-lab-01"
    set timezone 28
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.10.1 255.255.255.0
        set type hard-switch
    next
end
config firewall address
    edit "net-lan"
        set uuid 11111111-2222-3333-4444-555555555555
        set subnet 10.10.10.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set name "lan-to-wan"
        set uuid 66666666-7777-8888-9999-000000000000
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "net-lan"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set nat enable
    next
end
