#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
    edit "port3"
        set vdom "root"
        set ip 10.0.3.1 255.255.255.0
        set type physical
    next
    edit "port4"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.0
        set type physical
    next
end
config system zone
    edit "lan"
        set interface "port1" "port2"
    next
end
config firewall address
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
end
config firewall policy
    edit 10
        set name "two-sources"
        set srcintf "lan" "port3"
        set dstintf "port4"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 20
        set name "two-destinations"
        set srcintf "lan"
        set dstintf "port4" "port3"
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
    edit 30
        set name "from-any"
        set srcintf "any"
        set dstintf "port4"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 40
        set name "disabled-to-any"
        set status disable
        set srcintf "lan"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 50
        set name "unknown-source"
        set srcintf "port9"
        set dstintf "port4"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 60
        set name "zone-member"
        set srcintf "port1"
        set dstintf "port4"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 70
        set name "ipsec"
        set srcintf "port3"
        set dstintf "port4"
        set srcaddr "all"
        set dstaddr "all"
        set action ipsec
        set schedule "always"
        set service "ALL"
    next
end
