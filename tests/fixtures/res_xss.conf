#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
config system interface
    edit "port1"
        set vdom "root"
        set ip 10.0.1.1 255.255.255.0
        set type physical
        set alias "<b>{{ 7*7 }}</b>"
        set description "<!-- <script>alert(4)</script>"
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.2.1 255.255.255.0
        set type physical
    next
end
config firewall address
    edit "\"><svg onload=alert(2)>"
        set subnet 10.0.1.0 255.255.255.0
        set comment "Siehe https://evil.example/x.js & <iframe src=//evil.example>"
    next
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
end
config firewall service custom
    edit "HTTPS"
        set tcp-portrange 443
    next
end
config firewall policy
    edit 1
        set name "<img src=x onerror=alert(5)>"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "\"><svg onload=alert(2)>"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set comments "</script><img src=x onerror=alert(1)>"
    next
    edit 2
        set name "u2028"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "HTTPS"
        set comments "</SCRIPT ><script>alert(6)</script><!--"
    next
end
