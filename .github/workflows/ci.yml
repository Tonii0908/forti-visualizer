name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          fortidoc parse tests/fixtures/two_vdoms.conf
          fortidoc --input tests/fixtures/res_findings.conf --output doku-ci

  browser:
    name: Browser-Tests (Chromium, Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install ".[test]" "playwright==1.65.1"
      - name: Install browsers
        run: python -m playwright install --with-deps chromium firefox
      - name: Browser tests
        env:
          FORTIDOC_BROWSERS: chromium,firefox
          FORTIDOC_REQUIRE_BROWSERS: "1"
          FORTIDOC_PERF: "1"
        run: python -m pytest -q -rs -s tests/test_report_browser.py
